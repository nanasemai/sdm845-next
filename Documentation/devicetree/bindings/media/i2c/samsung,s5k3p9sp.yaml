# SPDX-License-Identifier: GPL-2.0-only
%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/samsung,s5k3p9sp.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S5K3P9SP Image Sensor

description:
  Samsung S5K3P9SP image sensor is a 16MP front camera sensor.
  The widest supported output image frame size is 4608x3456 at 30 frames
  per second, data output format is RAW10 transferred over a 4-lane MIPI
  CSI-2 D-PHY interface.

maintainers:
  - David Heidelberg <david@ixit.cz>

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: samsung,s5k3p9sp

  reg:
    maxItems: 1

  clocks:
    description: MCLK supply clock.
    maxItems: 1

  reset-gpios:
    description: Active low GPIO connected to RESET pad of the sensor.
    maxItems: 1

  vana-supply:
    description: Analogue voltage supply, 2.8 V.

  vdig-supply:
    description: Digital core voltage supply, 1.05 V.

  vio-supply:
    description: Digital I/O voltage supply, 1.8 V.

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2
              - const: 3
              - const: 4

        required:
          - link-frequencies

required:
  - compatible
  - reg
  - port

unevaluatedProperties: false

examples:
  - |
      #include <dt-bindings/gpio/gpio.h>

      i2c {
          #address-cells = <1>;
          #size-cells = <0>;

          camera@2d {
              compatible = "samsung,s5k3p9sp";
              reg = <0x2d>;
              clocks = <&camera_mclk 0>;
              assigned-clocks = <&camera_mclk 0>;
              assigned-clock-rates = <24000000>;
              reset-gpios = <&gpio1 10 GPIO_ACTIVE_LOW>;
              vana-supply = <&vreg_2p8>;
              vdig-supply = <&vreg_1p05>;
              vio-supply = <&vreg_1p8>;

              port {
                  endpoint {
                      link-frequencies = /bits/ 64 <700000000>;
                      remote-endpoint = <&mipi_csi_in>;
                  };
              };
          };
      };
...
