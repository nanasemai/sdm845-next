%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/idt,p9221.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: IDT P9221 Qi Wireless Power Receiver

maintainers:
  - David Heidelberg <david@ixit.cz>

description: |
  The IDT (now Renesas) P9221-R is a Qi-compliant wireless power receiver
  for up to 15W applications. It rectifies the coil voltage and provides a
  regulated 5V (BPP) or 9V (EPP) output that is typically fed into the
  system charger. The receiver is powered solely from the coil, so it is
  only reachable over I2C while it sits on a transmitter pad.

  The receiver runs a Cortex-M0 firmware which defines most of the register
  map. Devices shipped with customer-specific firmware (customer ID register
  0x03) may use a different map than the public datasheet.

allOf:
  - $ref: power-supply.yaml#

properties:
  compatible:
    const: idt,p9221

  reg:
    maxItems: 1

  interrupts:
    items:
      - description: INT pin, open-drain, active-low fault/status interrupt
      - description:
          VDD18 rail power-good, rises when the receiver powers up in field

  interrupt-names:
    items:
      - const: int
      - const: pg

  enable-gpios:
    description: GPIO connected to the active-low EN pin
    maxItems: 1

  idt,fod-bpp:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    minItems: 2
    maxItems: 16
    description:
      Foreign Object Detection calibration written to the receiver when
      operating in Baseline Power Profile (5V) mode. The values are
      board-specific gain/offset pairs generated by the vendor tooling.

  idt,fod-epp:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    minItems: 2
    maxItems: 16
    description:
      Foreign Object Detection calibration written to the receiver when
      operating in Extended Power Profile (9V) mode.

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        charger@61 {
            compatible = "idt,p9221";
            reg = <0x61>;

            interrupts-extended = <&tlmm 124 IRQ_TYPE_LEVEL_LOW>,
                                  <&tlmm 36 IRQ_TYPE_EDGE_BOTH>;
            interrupt-names = "int", "pg";

            enable-gpios = <&tlmm 122 GPIO_ACTIVE_LOW>;

            idt,fod-bpp = /bits/ 8 <0xa8 0x28 0x86 0x34 0x82 0x38
                                    0x9a 0x12 0x9c 0x0b 0x84 0x65>;
            idt,fod-epp = /bits/ 8 <0xa4 0x2a 0x86 0x36 0x84 0x3d
                                    0x9a 0x14 0x9d 0x0b 0xa2 0xfb>;
        };
    };
